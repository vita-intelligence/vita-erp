name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend directory exists
        id: check
        run: |
          if [ -d "backend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "backend/ not found — skipping backend CI"
          fi

      - name: Install uv
        if: steps.check.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv sync --group dev

      - name: Lint (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check (mypy)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run mypy .

      - name: Tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run python manage.py test --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-secret-key

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend directory exists
        id: check
        run: |
          if [ -d "frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "frontend/ not found — skipping frontend CI"
          fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test -- --run

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Verify all checks passed or were skipped
        run: |
          backend="${{ needs.backend-ci.result }}"
          frontend="${{ needs.frontend-ci.result }}"

          for result in "$backend" "$frontend"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Check failed with result: $result"
              exit 1
            fi
          done

          echo "All checks passed or were skipped."
