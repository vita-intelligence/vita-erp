name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check server directory exists
        id: check
        run: |
          if [ -d "server" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "server/ not found — skipping backend CI"
          fi

      - name: Set up Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: server/.python-version
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: ruff check .

      - name: Format check (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: ruff format --check .

      - name: Type check (mypy)
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: mypy .

      - name: Tests (pytest)
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: pytest --tb=short -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check client directory exists
        id: check
        run: |
          if [ -d "client" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "client/ not found — skipping frontend CI"
          fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: client
        run: npm ci

      - name: Lint (eslint)
        if: steps.check.outputs.exists == 'true'
        working-directory: client
        run: npm run lint

      - name: Type check (tsc)
        if: steps.check.outputs.exists == 'true'
        working-directory: client
        run: npm run typecheck

      - name: Tests (vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: client
        run: npm run test -- --run

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Verify all checks passed or were skipped
        run: |
          backend="${{ needs.backend-ci.result }}"
          frontend="${{ needs.frontend-ci.result }}"

          for result in "$backend" "$frontend"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Check failed with result: $result"
              exit 1
            fi
          done

          echo "All checks passed or were skipped."
