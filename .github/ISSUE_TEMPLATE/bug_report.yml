name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the sections below as thoroughly as possible.
        **Before submitting**, please search [existing issues](../../issues) to avoid duplicates.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have verified this bug exists on the latest version
          required: true
        - label: I am able to reproduce the issue consistently
          required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact of this bug?
      options:
        - "Critical — system crash, data loss, security vulnerability"
        - "High — major feature broken, no workaround"
        - "Medium — feature partially broken, workaround exists"
        - "Low — minor issue, cosmetic, edge case"
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Affected Area
      description: Which part of the app is affected? (e.g. login, stock list, invoice PDF)
      placeholder: e.g. authentication, purchase orders, dashboard
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide a step-by-step guide to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment.
      placeholder: |
        - OS: [e.g. macOS 14, Ubuntu 22.04]
        - Browser: [e.g. Chrome 123, Safari 17]
        - App Version / Commit: [e.g. v1.2.0 or commit SHA]
        - Deployment: [e.g. Docker, local dev]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      description: Paste any relevant logs or stack traces here.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that may help.
